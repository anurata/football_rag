name: Operation Cycle Match Pipeline

on:
  schedule:
    # 毎日 06:00 JST (21:00 UTC) - 日程同期 & Preview 自動生成
    - cron: '0 21 * * *'
    # 試合日 (水・金・土・日) の定期ポーリング (14:00, 17:00, 20:00, 23:00 JST)
    - cron: '0 5,8,11,14 * * 0,3,5,6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no DB/export side-effects)'
        required: false
        type: boolean
        default: false
      simulated_now:
        description: 'Simulated JST time (ISO8601, e.g. 2026-10-31T18:00)'
        required: false
        type: string
        default: ''

concurrency:
  group: match-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Execute scheduled match pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          CMD="python scripts/run_scheduled_pipeline.py"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          if [ -n "${{ inputs.simulated_now }}" ]; then
            CMD="$CMD --now ${{ inputs.simulated_now }}"
          fi
          echo "Executing: $CMD"
          eval $CMD

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/football.db data/chroma_db/ exports/
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): auto-update match pipeline [skip ci]"
            git push
          else
            echo "No database or export changes detected. Skipping push."
          fi

