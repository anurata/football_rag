ents": "松橋監督は先制後もラインを下げすぎないよう指示したが、大迫の個のプレスに対して森重・高のラインが孤立。スキッベ監督は失点直後に全体ラインを10m押し上げるアグレッシブな指示で流れを手繰り寄せた。"}, {"phase": "45-60", "dominant_team": "HOME", "momentum_summary": "後半開始とともに神戸が敵陣へ押し込む時間を拡大。ジエゴの左サイドからの果敢なオーバーラップと山川哲史のクサビのパスを契機に、FC東京の強固なブロックに揺さぶりをかける。しかしFC東京も森重真人とGKを中心とした中央の堅牢な守備で決定打を許さない。", "pressing_battle": "神戸は完全にFC東京を自陣へ押し込み、ハイプレスの網をハーフウェイライン付近に設定。FC東京は自陣深くで4-4-2のコンパクトな陣形を敷き、スペースを消しながらマルセロヒアンの一発のカウンターを狙う構図が鮮明化。", "tactical_adjustments": "スキッベ監督はジエゴに対しよりペナルティエリア付近への高い進入を許可。松橋監督は室屋成と佐藤恵允の間隔を狭めさせ、神戸の左サイドからの進入変換率を削るブロック再編を行った。"}, {"phase": "60-75", "dominant_team": "AWAY", "momentum_summary": "神戸の攻勢が続くなかでFC東京が一瞬の隙を突く。69分（後半24分）、速攻から抜け出した長倉幹樹が再びゴールネットを揺らし、FC東京が勝ち越しに成功。神戸は攻勢に出ていた背後を突かれる形となり、一転して重いプレッシャーを背負うこととなる。", "pressing_battle": "神戸の前がかりになったプレスの背後、アンカー脇のスペースに長倉幹樹が潜り込み、縦パス1本からマテウス・トゥーレルとの1対1の局面を作り出した。FC東京の鋭利な縦カウンターが神戸のリスキーな前傾姿勢を破壊した。", "tactical_adjustments": "勝ち越したFC東京はブロックの重心を下げて逃げ切り態勢にシフト。スキッベ監督は即座にパワープレーも辞さない攻撃シフトを命じ、CB山川哲史を高めの位置まで押し出してスクランブルを仕掛ける。"}, {"phase": "75-90+", "dominant_team": "HOME", "momentum_summary": "神戸の執念が実を結んだ終盤。FC東京の自陣防戦（敵陣支配度44.61%）に対し、神戸は総攻撃を敢行。迎えた後半48分、右サイドから押し込んだ混戦から、ペナルティエリア内に侵入した武藤嘉紀が泥臭くネットに突き刺し土壇場で同点。直後にタイムアップとなり、激闘は2-2のドローに終わった。", "pressing_battle": "神戸は被カウンターのリスクを完全に度外視し、山川哲史、酒井高徳がFC東京のクリアボールをことごとく回収する即時奪回（ゲーゲンプレス）を展開。FC東京は高宇洋が懸命にカバーするも、セカンドボールを拾われ続けて自陣から脱出不能に陥った。", "tactical_adjustments": "松橋監督は守備的交代で逃げ切りを図るも、交代組がボールホルダーへのアプローチで後手に回る。スキッベ監督は武藤嘉紀を完全にフリーマン化させ、エリア内の混戦に突入させるパワー勝負で勝ち点1をもぎ取った。"}], "key_tactical_events": [{"minute": 12, "period": "1H", "team_side": "AWAY", "category": "CHANCE_CREATION", "actors": ["バングーナガンデ　佳史扶", "佐藤　恵允"], "zone": "左サイド〜右ポケット", "description": "左サイド深くに侵入したバングーナガンデが鋭いアーリークロスを供給。ファーサイドのポケットにダイアゴナルに入り込んだ佐藤恵允がダイレクトで合わせ、立ち上がりの主導権をFC東京が握る決定機となった。"}, {"minute": 35, "period": "1H", "team_side": "AWAY", "category": "GOAL", "actors": ["佐藤　恵允", "長倉　幹樹"], "zone": "右サイド〜ペナルティエリア左", "description": "FC東京の速攻。ペナルティエリア手前右でボールを持った佐藤恵允が正確なクロスをエリア左へ通す。走り込んだ長倉幹樹がトラップから素早く左足を振り抜き、ゴール左下へ突き刺してアウェイのFC東京が先制。"}, {"minute": 40 早かった。40分にFC東京は自陣でボールを回収し、組み立てを図るため後方に戻したが、GKキム スンギュが足元のコントロールを失うと、プレスを仕掛けていた大迫 勇也がクリアをブロックし、そのままゴールへ押し込む形で試合を振り出しに戻した。神戸は後半、開始早々にアクシデントに見舞われ、酒井 高徳が負傷交代。代わって今季新加入の髙橋 壱晟が神戸デビュー戦のピッチに立ち、56分には集中した守りでピンチをしのぐ。後半の流れはFC東京が握る。神戸をゴール前に押し込み、クロスや正面からのシュートなど激しく攻め立てた。それでも、神戸はゴールの隙間を閉ざして守り、こぼれ球にも素早い反応で対抗する。その後もFC東京の攻勢は続き、69分には石原 広教が左サイドから絶妙なクロスを送り、ここは惜しくも合わないが、今度は右からクロスを入れ、最後は長倉 幹樹が頭でゴールに押し込む。一度はオフサイドの判定でノーゴールとなったが、VARの介入を経て得点が認められ、FC東京が勝ち越した。神戸は小松 蓮らを投入し、プレス強度を高めながら必死の反撃に出る。そして、アディショナルタイムのことだった。ジエゴのロングスローを起点に武藤 嘉紀がゴール右に叩き込んで同点とした。白熱の攻防にこれ以上の得点は生まれず、互いに勝点１ずつを分け合った。［ 文：小野 慶太 ］", "それ以前に、後半が始まったときにまず酒井（高徳）が負傷で交代せざるを得なかった。70分以降にもう少しフレッシュな選手を入れたかったのが（交代の）理由の１つで、あの２点目がオフサイドと判定されていたとしても３人の選手を代えていたと思っています。", "昨年大きなケガをしてから、自分の本来のパフォーマンスをなかなか出し切れない中でのシーズンを過ごして、今年はキャンプから順調にきている中で、やや違和感であったり、そういうものが出ながらも、今日はしっかり90分戦ってくれました。なおかつ２得点ということで、チームを本当に勝ちに導く上での活躍だったと思います。得点に限らず、相手のラインが低くなれば、ライン間でボールをしっかり受けた中でゲームのリズムを作ったり、難しい状況でしっかりキープをして次につなげる、次のわれわれの攻撃の機会を創出するというところでの、本当にトータルで非常に素晴らしい活躍をしてくれました。", "－－ケガから復帰した中で、しっかりしたプレーを見せている。"], "summary_text": "【負傷離脱・調整】エンリケ トレヴィザン（左膝内側側副靭帯損傷）, 荒木 遼太郎（右大腿二頭筋筋損傷）, 仲川 輝人（コンディション調整・プレー時間制限） / 【監督・公式言及】ノエビアスタジアム神戸での今季初戦。ホームの神戸は、１－０で勝利した開幕戦の福岡戦から大迫 勇也や武藤 嘉紀ら同じ先発11人を送り込む。一方、開幕戦の町田戦を１－５で落としたFC東京は先発３名を変更し、本間 至恩、森重 真人、バングーナガン..."}}}}, {"match_id": "20260814_VER_REY", "matchweek": 2, "date": "2026-08-14", "home_id": "VER", "away_id": "REY", "home_name": "東京ヴェルディ", "away_name": "柏レイソル", "home_score": 1, "away_score": 3, "stadium": "ＭＵＦＧスタジアム", "structured": {"match_id": "20260814_VER_REY", "home_team_id": "VER", "away_team_id": "REY", "home_formation": "4-4-2", "away_formation": "4-4-2", "tactical_highlights": ["東京ヴェルディと柏レイソルによる激闘（最終スコア: 1 - 3）", "得点者: 林 尚輝 (2分), 柏レイソル選手 (25分), 柏レイソル選手 (45分), 柏レイソル選手 (65分)", "局面ごとの戦術的適応とインテンシティの維持が勝敗を決定"], "phases": [{"phase": "0-15", "dominant_team": "AWAY", "momentum_summary": "立ち上がりは東京ヴェルディと柏レイソルによるインテンシティの高い攻防。セカンドボールの回収をめぐる中盤のせめぎ合い。", "pressing_battle": "東京ヴェルディが前線から連動プレスを仕掛け、柏レイソルはサイドスペースへの配球でプレス回避を狙う。", "tactical_adjustments": "序盤の探り合   function renderList() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const filter = document.getElementById('mwFilter').value;
    const container = document.getElementById('matchList');
    container.innerHTML = '';

    const filtered = MATCHES.filter(m => {
      const matchText = (m.home_name + ' ' + m.away_name + ' 第' + m.matchweek + '節').toLowerCase();
      const matchQuery = !query || matchText.includes(query);

      let matchFilter = true;
      if (filter === 'FCT') {
        matchFilter = (m.home_id === 'FCT' || m.away_id === 'FCT');
      } else if (filter !== 'ALL') {
        matchFilter = (String(m.matchweek) === filter);
      }
      return matchQuery && matchFilter;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:40px; color:#9ca3af;">該当する試合が見つかりません</div>';
      return;
    }

    filtered.forEach(m => {
      const card = document.createElement('div');
      card.className = 'match-card';
      card.onclick = () => openDrawer(m);

      const highlights = (m.structured && m.structured.tactical_highlights) || [];
      const hlText = highlights.length > 0 ? highlights[0] : (m.stadium + ' | ' + m.date);

      card.innerHTML = `
        <div class="match-meta">
          <span>第 ${m.matchweek} 節 | ${m.date}</span>
          <span>${m.stadium}</span>
        </div>
        <div class="score-board">
          <div class="team-block"><div class="team-name">${m.home_name}</div></div>
          <div class="score-center">${m.home_score} - ${m.away_score}</div>
          <div class="team-block"><div class="team-name">${m.away_name}</div></div>
        </div>
        <div class="highlights-preview">${hlText}</div>
      `;
      container.appendChild(card);
    });
  }

  function openDrawer(m) {
    const drawer = document.getElementById('detailDrawer');
    const title = document.getElementById('drawerTitle');
    const body = document.getElementById('drawerBody');

    title.innerText = `第${m.matchweek}節: ${m.home_name} vs ${m.away_name}`;

    const st = m.structured || {};
    const deep = st.deep_metrics || {};
    const conv = deep.conversion_rates || {};
    const hConv = conv.home || {};
    const aConv = conv.away || {};
    const ft = deep.field_tilt || {};

    let html = `
      <div class="score-board" style="margin-bottom:14px; background:rgba(255,255,255,0.03); border-radius:10px; padding:10px;">
        <div class="team-block">
          <div class="team-name">${m.home_name}</div>
          <div style="font-size:0.7rem; color:#9ca3af;">[${st.home_formation || '不明'}]</div>
        </div>
        <div class="score-center">${m.home_score} - ${m.away_score}</div>
        <div class="team-block">
          <div class="team-name">${m.away_name}</div>
          <div style="font-size:0.7rem; color:#9ca3af;">[${st.away_formation || '不明'}]</div>
        </div>
      </div>

      <div class="section-title">定量スタッツ＆進入効率</div>
      <div class="metric-row">
        <div class="metric-card">
          <div class="metric-label">敵陣支配率 (Field Tilt)</div>
          <div class="metric-val">${ft.home_field_tilt || 50}% : ${ft.away_field_tilt || 50}%</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">進入変換率 (30m->PA)</div>
          <div class="metric-val">${hConv.rate_30_to_pa || 0}% : ${aConv.rate_30_to_pa || 0}%</div>
        </div>
      </div>
    `;

    // Match Context Pre-conditions
    const ctx = st.match_context || {};
    if (ctx && Object.keys(ctx).length > 0) {
      const fatigue = ctx.schedule_fatigue || {};
      const disc = ctx.disciplinary || {};
      const wth = ctx.weather_pitch || {};
      const loan = ctx.loan_restrictions || {};
      const inj = ctx.injury_condition || {};

      html += `
        <div class="section-title">🛡️ 試合背景・前提サポート情報</div>
        <div style="background:rgba(15,23,42,0.6); border:1px solid #334155; border-radius:10px; padding:10px; margin-bottom:12px; font-size:0.75rem; line-height:1.6;">
          <div style="margin-bottom:4px;"><span style="color:#f97316;">🏥 怪我:</span> ${inj.summary_text || '離脱者なし'}</div>
          <div style="margin-bottom:4px;"><span style="color:#eab308;">🟨 規律:</span> ${disc.summary_text || '停止なし'}</div>
          <div style="margin-bottom:4px;"><span style="color:#60a5fa;">🗓️ 日程:</span> ${fatigue.summary_text || '-'}</div>
          <div style="margin-bottom:4px;"><span style="color:#a78bfa;">📄 契約:</span> ${loan.summary_text || '制限なし'}</div>
          <div><span style="color:#38bdf8;">🌦️ 気候:</span> ${wth.summary_text || '-'}</div>
        </div>
      `;
    }

    // Highlights
    if (st.tactical_highlights && st.tactical_highlights.length > 0) {
      html += '<div class="section-title">戦術ハイライト</div>';
      st.tactical_highlights.forEach(h => {
        html += `<div style="font-size:0.8rem; margin-bottom:6px; color:#e5e7eb;">• ${h}</div>`;
      });
    }

    // Phases
    if (st.phases && st.phases.length > 0) {
      html += '<div class="section-title">時間帯別ダイナミクス</div>';
      st.phases.forEach(p => {
        const dom = p.dominant_team === 'HOME' ? m.home_name : (p.dominant_team === 'AWAY' ? m.away_name : '互角');
        html += `
          <div class="phase-card">
            <div class="phase-header">
              <span>${p.phase}分</span>
              <span>主導権: ${dom}</span>
            </div>
            <div>${p.momentum_summary}</div>
          </div>
        `;
      });
    }

    // NotebookLM Prompt copy
    html += `
      <div class="prompt-box">
        <strong>💡 NotebookLMで仮説検証するプロンプト</strong>
        <p id="promptText" style="margin-top:4px;">
          ${m.date}の${m.home_name}対${m.away_name}戦（${m.home_score}-${m.away_score}）において、両チームの勝敗を分けた構造的要因とプレッシングの攻防について詳しく分析してください。
        </p>
        <button class="copy-btn" onclick="copyPrompt()">プロンプトをコピー</button>
      </div>
    `;

    body.innerHTML = html;
    drawer.classList.add('open');
  }

  function closeDrawer() {
    document.getElementById('detailDrawer').classList.remove('open');
  }

  function copyPrompt() {
    const text = document.getElementById('promptText').innerText;
    navigator.clipboard.writeText(text).then(() => {
      alert('プロンプトをクリップボードにコピーしました！NotebookLMで貼り付けて質問してください。');
    });
  }

  document.getElementById('searchInput').addEventListener('input', renderList);
  document.getElementById('mwFilter').addEventListener('change', renderList);

  renderList();
</script>
